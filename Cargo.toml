[package]
name = "boulder-dash-survival"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
bevy = { version = "0.18.1", default-features = false, features = [
    "default_app", "std", "bevy_winit", "multi_threaded", "x11", "wayland",
    "2d_bevy_render", "ui_bevy_render", "default_font",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
